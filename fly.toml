app = 'smart-groupware'
primary_region = 'nrt'

[build]

[env]
  DB_PATH = "/app/data/groupware.sqlite"
  UPLOAD_DIR = "/app/data/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "groupware_data"
  destination = "/app/data"
